---
name: Documentation improvement
description: Suggest README, usage, examples, or design document improvements
title: "[Docs]: "
labels: [documentation]
body:
  - type: dropdown
    id: doc_area
    attributes:
      label: Documentation area
      options:
        - README
        - V2 Alpha Usage
        - Examples
        - Rule authoring
        - Architecture docs
        - Release notes
        - Other
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should be improved?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or structure
